name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  swift-tests:
    uses: nocoo/base-ci/.github/workflows/test-job.yml@ab52d72877d386c9a8fd224e9ac868e88be90539
    with:
      runner: "macos-latest"
      runtime: "none"
      command: "swift test --enable-code-coverage"

  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@ab52d72877d386c9a8fd224e9ac868e88be90539
    with:
      runtime-version: "1.4.2"
      install-policy: "blocked"
      working-directory: "guardian"
      typecheck: false
      disabled-check-reasons: '{"typecheck": "no tsconfig in guardian; subproject checked during test and lint"}'
      lint-command: "bunx biome check --error-on-warnings . ../cli"
      test-command: "bun test && cd ../cli && bun test"
      lockfiles: "bun.lock"
      osv-config: "../osv-scanner.toml"
      gitleaks-config: "../.gitleaks.toml"
    secrets: inherit
